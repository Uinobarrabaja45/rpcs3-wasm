name: Browser frontend build

on:
  push:
    paths:
      - 'js/rpcs3_browser/**'
      - '.github/workflows/browser-build.yml'
  pull_request:
    paths:
      - 'js/rpcs3_browser/**'
      - '.github/workflows/browser-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: js/rpcs3_browser

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/rpcs3_browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create temporary WASM stubs for frontend check
        run: |
          for variant in Rpcs3512 Rpcs31024 Rpcs32048 Rpcs3Dyna; do
            cat > "src/${variant}.js" <<'EOF'
          export default async function () {
            throw new Error("WASM module not present in frontend-only CI build.");
          }
          EOF
          done

      - name: Build browser application
        run: npm run build
        env:
          CI: "false"
